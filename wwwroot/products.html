<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products | Jewelry Store</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/navbar.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/product.css">
</head>
<body>
    <!-- NAVBAR -->
    <div id="header-container"></div>

    <div class="hero-banner text-center mb-5">
        <h2>Discover Your Perfect Jewelry</h2>
    </div>

    <h1>Products</h1>
    <div id="products" class="row g-4"></div>
    <script>
        const categories = [
            {
                name: "Rings",
                image: "images/95296a86affce88cd67535d6e1f5c9c0.jpg",
                description: "Elegant rings for every occasion",
                link: "rings.html"
            },
            {
                name: "Earrings",
                image: "images/3607fecf56d7db494169543c20e7b9fb.jpg",
                description: "Stylish earrings for any outfit",
                link: "earrings.html"
            },
            {
                name: "Necklaces",
                image: "images/18324b57a8f1b24c700c775d67ade83f.jpg",
                description: "Beautiful necklaces to shine",
                link: "necklaces.html"
            }
        ];

        function displayCategories() {
            const container = document.querySelector(".row");
            container.innerHTML = "";

            categories.forEach(c => {
                container.innerHTML += `
                      <div class="col-md-4">
                        <a href="${c.link}" class="category-link d-block text-decoration-none text-center">
                          <div class="category-card">
                            <img src="${c.image}" alt="${c.name}">
                            <p>${c.name}</p>
                            <p class="description">${c.description}</p>
                            <button class="btn">See More</button>
                          </div>
                        </a>
                      </div>
                    `;
            });
        }

        displayCategories();
    </script>

    <footer>
        © 2025 Jewelry Store

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="/js/products.js"></script>
    <script src="/js/header.js"></script>



</body>
</html>
