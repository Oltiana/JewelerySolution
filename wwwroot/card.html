<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="css/card.css">
</head>
<body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">
                <img class="logo" src="./images/logo.png.jpg" alt="logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbar">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="home.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="AboutUs.html">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Products</a>
                    </li>
                </ul>
                <ul class="navbar-nav align-items-center">
                    <li class="nav-item me-3">
                        <a class="nav-link position-relative" href="card.html">
                            <i class="bi bi-bag fs-5"></i>
                            <span class="cart-badge" id="cartBadge">0</span>
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                            <i class="bi bi-person fs-5"></i>
                            <span id="navUserName" class="ms-1"></span>
                        </a>

                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="navbar.html?section=profile">Të dhënat personale</a></li>
                            <li><a class="dropdown-item" href="navbar.html?section=orders">Porositë</a></li>
                            <li><a class="dropdown-item" href="navbar.html?section=address">Adresat</a></li>
                            <li><a class="dropdown-item" href="navbar.html?section=cards">Kartelat e ruajtura</a></li>
                            <li><a class="dropdown-item" href="navbar.html?section=language">Gjuha & Shteti</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#" onclick="if(typeof logout === 'function') logout();">Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container my-5">
        <h3 class="mb-4">Your Cart</h3>

        <div class="row g-4">
            <!-- PRODUKTET -->
            <div class="col-lg-8">
                <div id="cartItems"></div>


            </div>

            <!-- TOTALI -->
            <div class="col-lg-4">
                <div class="card p-4">
                    <h5>Totali i porosisë</h5>

                    <div class="d-flex justify-content-between mt-3">
                        <span>Nëntotali:</span>
                        <span id="subtotal">0 €</span>
                    </div>

                    <div class="d-flex justify-content-between">
                        <span>TVSH 18%:</span>
                        <span id="tax">0 €</span>
                    </div>

                    <hr>

                    <div class="d-flex justify-content-between fw-bold fs-5">
                        <span>Total:</span>
                        <span id="grandTotal">0 €</span>
                    </div>
                    <button onclick="checkout()"
                            class="btn btn-outline-danger w-100 mt-3 fw-bold">
                        VAZHDO
                    </button>

                </div>
            </div>
        </div>
    </div>
    <script>
        function checkout() {
            window.location.href = "checkout.html";
        }
    </script>


    <script src="js/card.js"></script>
</body>
</html>
